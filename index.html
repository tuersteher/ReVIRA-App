<html lang="de">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../assets/css/dark-styles.css">

    <link rel="manifest" href="../manifest.json" type="application/json">
    <meta name="theme-color" content="#000">
    <meta name="description" content="Kapjon aktuális információkat az indulásokról és érkezésekről, menetrendekről és csatlakozásokról a magyar vasútállomásokon.">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Vonatinformációs Magyarország - magyar vasútállomás | ReVIRA">
    <meta property="og:description" content="Kapjon aktuális információkat az indulásokról és érkezésekről, menetrendekről és csatlakozásokról a magyar vasútállomásokon.">
    <meta property="og:image" content="https://revira.hu/assets/branding/icon-512x512.png">
    <meta property="og:url" content="https://revira.hu">
    <meta property="og:type" content="website">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Schema.org Markup -->
    <script type="application/ld+json">
        {
            "@context": "http://schema.org",
            "@type": "WebSite",
            "name": "ReVIRA",
            "url": "https://revira.hu",
            "description": "Aktuális információkat az indulásokról és érkezésekről, menetrendekről és csatlakozásokról a magyar vasútállomásokon.",
        }
    </script>
</head>


<body>
    <br><br><br>
    <center>
    <img src="./assets/blackSpinner.svg" class="loadingspinner  multicolorspinner">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const providerKey = "provider";
            let provider = localStorage.getItem(providerKey);

            if (!provider) {
            // Wenn noch kein Eintrag vorhanden ist → Standardwert setzen
            provider = {
                providerName: "MÁV Személyszállítás",
                providerID: "hu"
            };
            localStorage.setItem(providerKey, JSON.stringify(provider));
            } else {
            // vorhandenen Eintrag parsen
            provider = JSON.parse(provider);
            }

            // Weiterleiten auf ./PROVIDERID
            window.location.href = `./${provider.providerID}/index.html`;
        });
        </script>

</body>
</html>
